java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

base.archivesName = 'minecraft'

dependencies {
    api project(':api')

    api libs.asm
    api libs.tomlj
}

publishing {
    publications {
        publication(MavenPublication) {
            artifactId = base.archivesName.get()

            from components.java
        }
    }
}
