java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.property('java_version'))
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

base.archivesName = 'neoforge'

dependencies {
    api project(':api')
    api project(':neoforge-gradle-api')
    api project(':gradle')
    api project(':minecraft')

    testImplementation gradlelibs.tooling
    testImplementation project(':gradle-test-api')

    testRuntimeOnly project(":gradle-extract")
    testRuntimeOnly project(":neoforge-gradle-extract")
}

publishing {
    publications {
        publication(MavenPublication) {
            artifactId = base.archivesName.get()

            from components.java
        }
    }
}
