java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

base.archivesName = 'core'

dependencies {
    api project(":api")
    api project(":gradle")

    api loggerLibs.log4j2.core
    api loggerLibs.log4j2.slf4j
    api loggerLibs.log4j2.jul

    api libs.quack
    api libs.snakeyaml
    api libs.okhttp

    runtimeOnly project(':intellij')
    runtimeOnly project(':mcforge')
    runtimeOnly project(':neoforge')

    testImplementation project(':gradle-test-api')
}

test {
    systemProperty("net.covers1624.covers1624.wstool.test_update", project.findProperty("test_update") != null)
}

jar {
    manifest {
        attributes 'Specification-Title': 'WorkspaceTool'
        attributes 'Specification-Vendor': 'covers1624'
        attributes 'Specification-Version': "1"
        attributes 'Implementation-Title': 'WorkspaceTool - Core'
        attributes 'Implementation-Vendor': 'covers1624'
        attributes 'Implementation-Version': version
        attributes 'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
    }
}

publishing {
    publications {
        publication(MavenPublication) {
            artifactId base.archivesName.get()

            from components.java
            artifact(rootProject.tasks.named('genVersionManifest')) {
                extension 'json'
            }
        }
    }
}

