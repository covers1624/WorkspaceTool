java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.property('java_version'))
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

base.archivesName = 'neoforge-gradle-extract'

dependencies {
    api project(':gradle-extract')

    api project(':neoforge-gradle-api')

    compileOnly gradleApi()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

publishing {
    publications {
        publication(MavenPublication) {
            artifactId = base.archivesName.get()

            from components.java
        }
    }
}
