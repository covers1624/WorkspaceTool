java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.property('java_version'))
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

base.archivesName = 'intellij'

dependencies {
    api project(':api')

    api libs.jdom2
    api libs.lang3
    api libs.mavenartifact
}

publishing {
    publications {
        publication(MavenPublication) {
            artifactId = base.archivesName.get()

            from components.java
        }
    }
}
